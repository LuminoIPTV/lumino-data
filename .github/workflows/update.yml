name: Auto Update M3U Playlist

on:
  schedule:
    # Her gün gece 00:00'da (UTC) otomatik çalışır
    - cron: '0 0 * * *'
  workflow_dispatch: # Elle de başlatma imkanı verir

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Linkleri Taramasını Çalıştır
        run: python fetch_channels.py

      - name: Güncellenmiş playlist.m3u Dosyasını Depoya Kaydet
        run: |
          git config --global user.name "Lumino Bot"
          git config --global user.email "bot@luminoiptv.local"
          git add playlist.m3u
          git commit -m "Automated playlist update [skip ci]" || exit 0
          git push
