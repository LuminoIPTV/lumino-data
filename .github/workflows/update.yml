name: Otomatik IPTV Güncelleyici

on:
  schedule:
    - cron: '0 0 * * *' # Her gün gece yarısı otomatik çalışır
  workflow_dispatch: # Manuel olarak istediğin an test edebilmen için

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Güncelleyici Scripti Çalıştır
        run: python update_iptv.py

      - name: playlist.m3u Dosyasını Depoya Kaydet
        run: |
          git config --global user.name "IPTV Bot"
          git config --global user.email "bot@luminoiptv.local"
          git add playlist.m3u
          git commit -m "Otomatik kanal listesi güncellendi ve temizlendi" || exit 0
          git push
